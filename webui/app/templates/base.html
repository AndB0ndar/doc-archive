<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDF Search{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">📄 PDF Search</a></h1>
            <nav>
                <a href="{{ url_for('main.about') }}">О проекте</a>
                {% if session.user %}
                    <a href="{{ url_for('main.index') }}"><i class="fas fa-search"></i> Поиск</a>
                    <a href="{{ url_for('main.my_documents') }}"><i class="fas fa-folder"></i> Мои документы</a>
                    <a href="{{ url_for('auth.logout') }}"><i class="fas fa-sign-out-alt"></i> Выйти</a>
                {% else %}
                    <a href="{{ url_for('auth.login') }}">Войти</a>
                {% endif %}
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <div id="toast-container" style="position: fixed; bottom: 1rem; right: 1rem; z-index: 1000;"></div>

    <script>
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark');
            toggle.innerHTML = '<i class="fas fa-sun"></i>';
        } else {
            document.body.classList.remove('dark');
            toggle.innerHTML = '<i class="fas fa-moon"></i>';
        }
        toggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            toggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });

        document.addEventListener('DOMContentLoaded', () => {
            const flashes = {{ get_flashed_messages(with_categories=true) | tojson | safe }};
            flashes.forEach(([category, message]) => {
                showToast(message, category === 'error' ? 'error' : 'success');
            });
        });

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#3b82f6';
            toast.style.color = 'white';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        document.body.addEventListener('click', (e) => {
            const btn = e.target.closest('.delete-btn');
            if (btn && btn.hasAttribute('hx-confirm')) {
                e.preventDefault();
                Swal.fire({
                    title: 'Вы уверены?',
                    text: btn.getAttribute('hx-confirm') || 'Действие необратимо.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Да, удалить!'
                }).then((result) => {
                    if (result.isConfirmed) {
                        htmx.trigger(btn, 'click');
                    }
                });
            }
        });
    </script>
</body>
</html>
