{% extends "base.html" %}

{% block content %}
<h2>🔍 Поиск по документам</h2>
<div class="search-box">
    <input type="text"
           name="q"
           placeholder="Что ищете? Например: «нейронные сети»"
           hx-get="/search"
           hx-trigger="keyup changed delay:500ms"
           hx-target="#results"
           hx-indicator="#spinner"
           hx-vals='js:{type: document.getElementById("search-type").value}'>
    <select id="search-type" name="type" hx-get="/search" hx-target="#results" hx-trigger="change">
        <option value="text">📖 Полнотекстовый</option>
        <option value="vector">🧠 Семантический (AI)</option>
    </select>
    <div id="spinner" class="htmx-indicator"><i class="fas fa-spinner fa-pulse"></i> Ищем...</div>
</div>
<div id="results"></div>

<hr>

<div style="margin-top: 2rem; text-align: center;">
    <a href="{{ url_for('main.upload') }}" class="button"><i class="fas fa-upload"></i> Загрузить новый PDF</a>
    <a href="{{ url_for('main.my_documents') }}" class="button" style="background: #64748b;"><i class="fas fa-folder"></i> Мои документы</a>
</div>
{% endblock %}
