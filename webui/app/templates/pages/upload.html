{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <h2><i class="fas fa-cloud-upload-alt"></i> Загрузка PDF</h2>
    <form method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label><i class="fas fa-file-pdf"></i> PDF файл *</label>
            <input type="file" name="file" accept=".pdf" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-heading"></i> Название *</label>
            <input type="text" name="title" placeholder="Введите название документа" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-user"></i> Авторы</label>
            <input type="text" name="authors" placeholder="Иванов И.И., Петров П.П.">
        </div>
        <div class="form-group">
            <label><i class="fas fa-calendar-alt"></i> Год</label>
            <input type="number" name="year" min="1900" max="2099" placeholder="2025">
        </div>
        <div class="form-group">
            <label><i class="fas fa-tags"></i> Категория</label>
            <input type="text" name="category" placeholder="Наука, Технологии, ...">
        </div>
        <button type="submit"><i class="fas fa-check"></i> Загрузить</button>
    </form>
</div>
{% endblock %}
