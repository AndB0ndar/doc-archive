name: doc-archive

include:
  - infra/docker-compose.infra.yml

services:
  rag:
    build: ../embedder
    container_name: rag
    environment:
      EMBED_MODEL_NAME: ${EMBED_MODEL:-all-MiniLM-L6-v2}
      RERANK_MODEL_NAME: ${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      READER_MODEL_NAME: ${READER_MODEL:-distilbert-base-cased-distilled-squad}
      MAX_TEXT_LENGTH: 5000
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /cache/huggingface  # for cache
    ports:
      - "5001:5000"
    volumes:
      - hf_cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - doc-net

  indexer:
    build: ../server
    container_name: indexer
    command: ["./indexer"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-docdb}?sslmode=disable
      REDIS_URL: redis:6379
      MINIO_URL: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-pdf-documents}
      EMBEDDER_URL: http://rag:5000
      RERANKER_URL: http://rag:5000
      READER_URL: http://rag:5000
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 50
      QUEUE_CONCURRENCY: 5
      QUEUE_MAX_RETRY: 3
      QUEUE_TIMEOUT_SEC: 600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rag:
        condition: service_healthy
    networks:
      - doc-net

  api-gateway:
    build: ../server
    container_name: api-gateway
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-docdb}?sslmode=disable
      REDIS_URL: redis:6379
      MINIO_URL: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-pdf-documents}
      EMBEDDER_URL: http://rag:5000
      RERANKER_URL: http://rag:5000
      READER_URL: http://rag:5000
      PORT: 8080
      ENV: development
      SECRET_KEY: ${SECRET_KEY:-your-strong-secret-key}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rag:
        condition: service_healthy
      indexer:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - doc-net

  webui:
    build: ../webui
    container_name: web-ui
    environment:
      GO_API_BASE_URL: http://api-gateway:8080
      SECRET_KEY: ${SECRET_KEY:-your-strong-secret-key}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5005:5000"
    depends_on:
      api-gateway:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - doc-net

volumes:
  hf_cache:

networks:
  doc-net:
    driver: bridge

